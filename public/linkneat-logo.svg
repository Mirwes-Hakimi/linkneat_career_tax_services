<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220">
  <!-- Outer dark border -->
  <circle cx="110" cy="110" r="109" fill="#5a3d00"/>
  <!-- Gold ring -->
  <circle cx="110" cy="110" r="106" fill="#c8952a"/>
  <!-- Inner gold ring dark edge -->
  <circle cx="110" cy="110" r="88" fill="#a87320"/>
  <!-- White inner circle -->
  <circle cx="110" cy="110" r="85" fill="#ffffff"/>
  <!-- Thin green inner accent ring -->
  <circle cx="110" cy="110" r="68" fill="none" stroke="#1a5c2e" stroke-width="2.5"/>

  <!-- LINKNEAT text arced on top of gold ring -->
  <path id="topRing" d="M 12,110 A 98,98 0 0,1 208,110" fill="none"/>
  <text font-family="Arial Black, Arial, sans-serif" font-size="17" font-weight="900"
        fill="#1a1200" letter-spacing="5">
    <textPath href="#topRing" startOffset="50%" text-anchor="middle">LINKNEAT</textPath>
  </text>

  <!-- CAREER DEVELOPMENT CONSULTANT arced on bottom -->
  <path id="bottomRing" d="M 14,116 A 96,96 0 0,0 206,116" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="8" font-weight="700"
        fill="#1a1200" letter-spacing="1.2">
    <textPath href="#bottomRing" startOffset="50%" text-anchor="middle">CAREER DEVELOPMENT CONSULTANT</textPath>
  </text>

  <!-- Large green L -->
  <text x="58" y="138" font-family="Georgia, Times New Roman, serif" font-size="62"
        font-weight="900" fill="#1a5c2e">L</text>

  <!-- Large green N -->
  <text x="118" y="138" font-family="Georgia, Times New Roman, serif" font-size="62"
        font-weight="900" fill="#1a5c2e">N</text>

  <!-- Handshake (two arms clasping) -->
  <g transform="translate(110,86)" fill="#c8952a">
    <!-- Left arm/forearm -->
    <path d="M-38,-8 Q-20,-12 0,-4 Q-10,4 -26,6 Q-38,4 -42,0 Z" opacity="0.9"/>
    <!-- Right arm/forearm -->
    <path d="M38,-8 Q20,-12 0,-4 Q10,4 26,6 Q38,4 42,0 Z" opacity="0.9"/>
    <!-- Center clasp -->
    <ellipse cx="0" cy="-2" rx="12" ry="9" fill="#bf8c20"/>
    <!-- Thumb left -->
    <path d="M-18,-14 Q-10,-18 -4,-12 Q-10,-8 -18,-10 Z" fill="#bf8c20"/>
    <!-- Thumb right -->
    <path d="M18,-14 Q10,-18 4,-12 Q10,-8 18,-10 Z" fill="#bf8c20"/>
  </g>

  <!-- Pen/signature stroke under LN -->
  <path d="M 68,148 Q 90,160 110,155 Q 130,150 150,148"
        stroke="#c8952a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Pen nib -->
  <polygon points="150,143 158,148 150,153" fill="#c8952a"/>

  <!-- Decorative dots in gold ring -->
  <circle cx="22" cy="110" r="3.5" fill="#5a3d00"/>
  <circle cx="198" cy="110" r="3.5" fill="#5a3d00"/>
</svg>
